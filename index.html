
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Input Output Mahasiswa</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <h1>DATA MAHASISWA</h1>
            <p class="subtitle">Silakan masukkan data mahasiswa</p>

            <!-- BAGIAN INPUT -->
            <form id="mahasiswaForm">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="npm">NPM</label>
                    <input
                        type="text"
                        id="npm"
                        placeholder="Masukkan NPM"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="prodi">Program Studi</label>
                    <input
                        type="text"
                        id="prodi"
                        placeholder="Masukkan program studi"
                        required
                    >
                </div>

                <!-- TOMBOL PROSES -->
                <button type="submit" id="prosesButton">
                    PROSES
                </button>

            </form>

            <!-- BAGIAN OUTPUT -->
            <div id="output" class="output hidden">

                <h2>HASIL DATA MAHASISWA</h2>

                <div class="output-item">
                    <span>Nama Lengkap</span>
                    <strong id="hasilNama"></strong>
                </div>

                <div class="output-item">
                    <span>NPM</span>
                    <strong id="hasilNpm"></strong>
                </div>

                <div class="output-item">
                    <span>Program Studi</span>
                    <strong id="hasilProdi"></strong>
                </div>

                <p class="success-message">
                    Data berhasil diproses!
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
